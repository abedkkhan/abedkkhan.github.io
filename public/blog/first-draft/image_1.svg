<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="terrain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f59e0b" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.01"/>
    </linearGradient>

    <marker id="arrowAmber" viewBox="0 0 10 10" refX="7" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>

    <marker id="arrowDim" viewBox="0 0 10 10" refX="7" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a94"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#111113"/>

  <g font-family="'JetBrains Mono', 'Menlo', monospace">

    <!-- axes -->
    <path d="M 90 60 L 90 452" stroke="#2a2a30" stroke-width="1.5"/>
    <path d="M 90 452 L 1120 452" stroke="#2a2a30" stroke-width="1.5"/>
    <text x="90" y="42" font-size="17" fill="#a1a1aa">reward</text>
    <text x="1120" y="482" font-size="17" fill="#a1a1aa" text-anchor="end">search space</text>

    <!-- the landscape, as a silhouette only, so the routes across it stay legible -->
    <path d="M 90 404 C 210 400, 320 254, 400 252 C 480 250, 560 330, 650 374
             C 750 420, 860 134, 950 132 C 1020 130, 1060 200, 1110 262
             L 1110 452 L 90 452 Z"
          fill="url(#terrain)" stroke="none"/>
    <path d="M 90 404 C 210 400, 320 254, 400 252 C 480 250, 560 330, 650 374
             C 750 420, 860 134, 950 132 C 1020 130, 1060 200, 1110 262"
          fill="none" stroke="#3d2a11" stroke-width="1.5"/>

    <!-- the climb the reward signal rewards: every step scores better than the last -->
    <path d="M 112 403 C 216 399, 320 255, 384 252"
          fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"
          marker-end="url(#arrowAmber)"/>

    <!-- the route to the higher peak: it goes down before it goes up -->
    <path d="M 416 254 C 490 254, 562 332, 650 374 C 748 420, 858 138, 934 132"
          fill="none" stroke="#8a8a94" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="2 11" marker-end="url(#arrowDim)"/>

    <!-- local optimum -->
    <circle cx="400" cy="252" r="8" fill="#f59e0b"/>
    <circle cx="400" cy="252" r="17" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.35"/>
    <text x="400" y="214" font-size="19" fill="#e5e5e5" text-anchor="middle">local optimum</text>
    <text x="400" y="192" font-size="16" fill="#71717a" text-anchor="middle">where selection settles</text>

    <!-- global optimum -->
    <circle cx="950" cy="132" r="8" fill="none" stroke="#a1a1aa" stroke-width="2"/>
    <text x="950" y="94" font-size="19" fill="#e5e5e5" text-anchor="middle">global optimum</text>
    <text x="950" y="72" font-size="16" fill="#71717a" text-anchor="middle">never reached</text>

    <!-- the valley of stepping stones -->
    <path d="M 650 386 L 650 414" stroke="#4a4a55" stroke-width="1.5"/>
    <text x="650" y="438" font-size="17" fill="#8a8a94" text-anchor="middle">the way across scores lower at every step</text>
  </g>
</svg>
